name: Deploy to GitHub Pages

# Publishes the static site (no build step) to GitHub Pages.
# The app is plain HTML/CSS/ES modules, so the repository root is
# uploaded verbatim as the Pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do NOT cancel in-progress runs so
# that production deployments are allowed to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the app's public assets. Serving the whole repository would
      # expose tracked working files (README, server, tests, …) as well as any
      # local/private files that happen to be present — see
      # epub-security-audit.md finding #2.
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R src styles vendor _site/
          if [ -f epub-security-audit.md ]; then cp epub-security-audit.md _site/; fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the explicitly selected public assets.
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
